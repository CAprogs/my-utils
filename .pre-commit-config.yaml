# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

exclude: '^<dbt_prj_name>/seeds/'
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: check-merge-conflict
    - id: check-ast
    - id: trailing-whitespace
    - id: check-symlinks
    - id: check-json
    - id: name-tests-test
      args: [ --pytest-test-first ]
    - id: no-commit-to-branch
      args: [ -b , main ]
    - id: requirements-txt-fixer
- repo: https://github.com/asottile/pyupgrade
  rev: v3.19.1
  hooks:
    - id: pyupgrade
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.22.1
  hooks:
    - id: gitleaks
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.8.6
  hooks:
    - id: ruff
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.14.1
  hooks:
    - id: mypy
      verbose: true
      args: [ --install-types, --non-interactive, --pretty, --disallow-untyped-defs, --strict-equality,  --warn-no-return, --ignore-missing-imports ]
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 3.3.0
  hooks:
    - id: sqlfluff-lint
      additional_dependencies: ['dbt-core==1.9.1', 'dbt-snowflake==1.9.0', 'sqlfluff-templater-dbt']
      args: [--config, ./.sqlfluff.cfg, ./dbt_blackbelt/]
      exclude: |
            (?x)^(
                target/.*|
                dbt_packages/.*|
                macros/.*
            )$
    - id: sqlfluff-fix
      args: [--config, ./.sqlfluff.cfg, --show-lint-violations, ./dbt_blackbelt/]
      exclude: |
            (?x)^(
                target/.*|
                dbt_packages/.*|
                macros/.*
            )$
      additional_dependencies: ['dbt-core==1.9.1', 'dbt-snowflake==1.9.0', 'sqlfluff-templater-dbt']
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.2.1
  hooks:
    - id: commitizen
      stages: [commit-msg]
    - id: commitizen-branch
      stages: [pre-push]

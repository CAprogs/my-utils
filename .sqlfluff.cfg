# Original config used : https://gitlab.ippon.fr/jnadal/dbt-ippon-utils/-/blob/b6696c9643f0555be73182c95b3c764c56f64b6d/.sqlfluff
[sqlfluff]
# verbose is an integer (0-2) indicating the level of log output
verbose = 0
# Or run 'sqlfluff dialects'
dialect = snowflake
max_line_length = 230
# Comma separated list of rules to check, or None for all
rules = L001, L002, L005, L006, L007, L008, L009, L010, L011, L012, L013, L014, L015, L016, L017, L018, L019, L020, L021, L022, L023, L025, L026, L027, L028, L029, L030, L032, L033, L036, L037, L038, L040, L041, L042, L043, L044, L045, L046, L048, L049, L050, L051, L053, L054, L055, L056, L057, L058, L059, L060, L061, L062, L065
# Comma separated list of rules to exclude, or None
exclude_rules = None
# Below controls SQLFluff output, see max_line_length for SQL output
output_line_length = 130
# Very large files can make the parser effectively hang.
# The more efficient check is the _byte_ limit check which
# is enabled by default. The previous _character_ limit check
# is still present for backward compatibility. This will be
# removed in a future version.
# Set either to 0 to disable.
large_file_skip_char_limit = 0
# Ignore inline overrides (e.g. to test if still required)
disable_noqa = False
# Comma separated list of file extensions to lint
# NB: This config will only apply in the root folder
sql_file_exts = .sql
templater = dbt


[sqlfluff:templater:dbt]
project_dir = ./dbt_blackbelt/
profiles_dir = ./dbt_blackbelt/profiles/
profile = dbt_blackbelt
target = dev


[sqlfluff:indentation]
indented_joins = False
template_blocks_indent = True
indented_using_on = True
indented_on_contents = False

# See https://docs.sqlfluff.com/en/stable/indentation.html

# Some rules can be configured directly from the config common to other rules
[sqlfluff:rules]
allow_scalar = True
single_table_references = consistent
unquoted_identifiers_policy = all

############################ DOC of used rules ############################

[sqlfluff:rules:layout.spacing]
# No trailing spaces
# Can be fixed automatically

[sqlfluff:layout:type:alias_expression]
# We want non-default spacing _before_ the alias expressions.
spacing_before = align
# We want to align them within the next outer select clause.
# This means for example that alias expressions within the FROM
# or JOIN clause would _not_ be aligned with them.
align_within = select_clause
# The point at which to stop searching outward for siblings, which
# in this example would likely be the boundary of a CTE. Stopping
# when we hit brackets is usually a good rule of thumb for this
# configuration.
align_scope = bracketed

[sqlfluff:rules:layout.indent]
# Use only spaces (or only tabs but not both) to indent
# Can be fixed automatically

[sqlfluff:rules:layout.operators]
# If using multiline operations, operator should be :
operator_new_lines = after

[sqlfluff:rules:layout.end_of_file]
# Files must end with a single trailing newline.
# Can be fixed automatically


[sqlfluff:rules:capitalisation.keywords]
# Keywords
capitalisation_policy = upper
# Comma separated list of words to ignore for this rule
ignore_words = None
# Can be fixed automatically

[sqlfluff:rules:aliasing.table]
# Aliasing preference for tables
aliasing = explicit
# Can be fixed automatically

[sqlfluff:rules:aliasing.column]
# Aliasing preference for columns
aliasing = explicit
# Can be fixed automatically

[sqlfluff:rules:aliasing.expression]
# Aliasing is mandatory when doing an operation / aggregation
allow_scalar = False
# Not sure what allow_scalar changes

[sqlfluff:rules:capitalisation.identifiers]
# Unquoted identifiers must be upper case
extended_capitalisation_policy = upper
# Comma separated list of words to ignore for this rule
ignore_words = None
# Can be fixed automatically
# MUST CHECK HOW TO DO WHEN ACCESSING JSON OBJECTS

[sqlfluff:rules:structure.distinct]
# DISTINCT is not a function and applies to all element in SELECT statement : should never be used with parenthesis
# Can be fixed automatically

[sqlfluff:rules:layout.long_lines]
# Line length
ignore_comment_lines = False
ignore_comment_clauses = False
# Can be fixed automatically

[sqlfluff:rules:layout.functions]
# Function name must immediately followed by parenthesis
# Can be fixed automatically

[sqlfluff:rules:layout.cte_bracket]
# WITH clause closing bracket should be aligned with WITH keyword.
# Can be fixed automatically

# Can be fixed automatically
[sqlfluff:layout:type:comma]
line_position = leading

[sqlfluff:rules:aliasing.unique.table]
# Table aliases should be unique within each clause.

[sqlfluff:rules:ambiguous.distinct]
# DISTINCT and GROUP BY should not be used in same SELECT statement

[sqlfluff:rules:layout.cte_newline]
# A blank line must be added after a CTE
# Can be fixed automatically

[sqlfluff:rules:aliasing.unused]
# Tables should not be aliased if that alias is not used.
# Can be fixed automatically

[sqlfluff:rules:references.from]
# References must be in FROM clause

[sqlfluff:rules:references.qualification]
# References must be applied if there is more than one aliased table in SELECT statement

[sqlfluff:rules:references.consistent]
# References must be consistently used in statement with 1 table

[sqlfluff:rules:references.keywords]
# Keywords should not be used as identifiers.
unquoted_identifiers_policy = aliases
quoted_identifiers_policy = None
# Comma separated list of words to ignore for this rule
ignore_words = data, last_name, first_name, email, login
ignore_words_regex = None

[sqlfluff:rules:capitalisation.functions]
# Function names
capitalisation_policy = upper
# Comma separated list of words to ignore for this rule
ignore_words = None
# Can be fixed automatically

[sqlfluff:rules:structure.using]
# Never use USING but use ON and specify

[sqlfluff:rules:ambiguous.union]
# UNION [DISTINCT|ALL] is preferred over just UNION.

[sqlfluff:rules:layout.select_targets]
# Select targets should be on a new line unless there is only one select target.
# If only one, it must be on the same line as select, is that wanted ?
# Can be fixed automatically

[sqlfluff:rules:ambiguous.order_by]
# Ambiguous ordering directions for columns in order by clause.
# Can be fixed automatically

[sqlfluff:rules:convention.select_trailing_comma]
# Trailing commas
select_clause_trailing_comma = forbid
# Can be fixed automatically

[sqlfluff:rules:capitalisation.literals]
# Null & Boolean Literals
capitalisation_policy = upper
# Comma separated list of words to ignore for this rule
ignore_words = None
# Can be fixed automatically

[sqlfluff:rules:layout.select_modifiers]
# SELECT modifiers (e.g. DISTINCT) must be on the same line as SELECT.
# Can be fixed automatically

[sqlfluff:rules:structure.subquery]
# Join/From clauses should not contain subqueries. Use CTEs instead.
forbid_subquery_in = both

[sqlfluff:rules:structure.simple_case]
# Unnecessary CASE statement.
# Usually, replaces with COALESCE (more efficient)
# Can be fixed automatically

[sqlfluff:rules:ambiguous.column_count]
# Never use * in SELECT
# NOTE : this does not raise error if * is used in CTEs

[sqlfluff:rules:structure.unused_cte]
# Query defines a CTE (common-table expression) but does not use it.

[sqlfluff:rules:jinja.padding]
# Jinja tags should have a single whitespace on either side.

[sqlfluff:rules:convention.is_null]
# Comparisons with NULL should use “IS” or “IS NOT”.
# Can be fixed automatically

[sqlfluff:rules:layout.start_of_file]
# Files must not begin with newlines or whitespace.
# Can be fixed automatically

[sqlfluff:rules:ambiguous.join]
# INNER JOIN must be fully qualified. JOIN == INNER JOIN
# Can be fixed automatically

[sqlfluff:rules:convention.statement_brackets]
# Top-level statements should not be wrapped in brackets.
# Can be fixed automatically

[sqlfluff:rules:ambiguous.column_references]
# GROUP BY/ORDER BY column references
group_by_and_order_by_style = consistent

[sqlfluff:rules:convention.left_join]
# Use LEFT JOIN instead of RIGHT JOIN.

[sqlfluff:rules:tsql.sp_prefix]
# The SP_ prefix is used to identify system procedures and
#can adversely affect performance of the user-defined stored procedure.
# It can also break system procedures if there is a naming conflict.

[sqlfluff:rules:references.special_chars]
# Never use special characters in identifiers
unquoted_identifiers_policy = all
quoted_identifiers_policy = all
allow_space_in_identifier = False
additional_allowed_characters = ""

[sqlfluff:rules:structure.nested_case]
# Nested CASE statement in ELSE clause could be flattened.
# Can be fixed automatically

[sqlfluff:rules:references.quoting]
# Policy on quoted and unquoted identifiers
prefer_quoted_identifiers = False
prefer_quoted_keywords = False
ignore_words = None
ignore_words_regex = None

[sqlfluff:rules:convention.coalesce]
# Use COALESCE instead of IFNULL or NVL.
# Can be fixed automatically

[sqlfluff:rules:convention.not_equal]
# Use != instead of <> for “not equal to” comparisons.
# Can be fixed automatically

[sqlfluff:rules:convention.blocked_words]
# Comma separated list of blocked words that should not be used
blocked_words = None
blocked_regex = None
match_source = False

